name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-verification
          path: |
            test-results/render-report.json
            test-results/*-frame.png
          if-no-files-found: ignore
