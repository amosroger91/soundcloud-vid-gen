# Apache vhost for https://finds.wellspringstudiollc.com (TLS added by certbot).
<VirtualHost *:80>
    ServerName finds.wellspringstudiollc.com
    # TikTok URL-prefix verification files are served directly and stay public.
    AliasMatch "^/(tiktok[A-Za-z0-9]+\.txt)$" "/opt/finds-studio/verify/$1"
    ProxyPassMatch "^/tiktok[A-Za-z0-9]+\.txt$" !
    <Directory /opt/finds-studio/verify>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyPass / http://127.0.0.1:4318/
    ProxyPassReverse / http://127.0.0.1:4318/

    # The studio has no accounts of its own; the whole app sits behind a password.
    <Location />
        AuthType Basic
        AuthName "Finds Studio"
        AuthUserFile /opt/finds-studio/.htpasswd
        Require valid-user
    </Location>
    # Homepage, privacy policy, terms and TikTok URL verification stay public.
    <Location /site/>
        Require all granted
    </Location>
    <LocationMatch "^/tiktok[A-Za-z0-9]+\.txt$">
        Require all granted
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/finds-studio-error.log
    CustomLog ${APACHE_LOG_DIR}/finds-studio-access.log combined
</VirtualHost>
